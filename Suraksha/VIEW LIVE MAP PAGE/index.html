<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Crime Map | Suraksha</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Your native stylesheet[cite: 1] -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Safely forces the map to fill the space between the top and bottom navs */
    .map-wrapper {
        flex-grow: 1;
        height: calc(100vh - 140px); 
        width: 100%;
        position: relative;
        z-index: 1;
    }
    #liveMap { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <!-- Wrapping everything in your native app-container[cite: 1] -->
  <div class="app-container">
    
    <!-- EXACT NATIVE HEADER[cite: 1] -->
    <header class="app-header">
      <div class="header-left">
        <button class="hamburger-btn" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <a class="brand" href="../HOME PAGE/index.html" aria-label="Suraksha Home">
          <img src="../assets/logo.png" alt="Suraksha Logo" class="brand-logo">
          <span class="brand-name">Suraksha</span>
        </a>
      </div>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="../HOME PAGE/index.html" class="desktop-nav-item">Home</a>
        <!-- Adjusted paths and moved 'active' to Live Map[cite: 1] -->
        <a href="../REPORT PAGE/index.html" class="desktop-nav-item">Report</a>
        <a href="index.html" class="desktop-nav-item active">Live Map</a>
        <a href="tel:112" class="desktop-nav-item emergency-link">Emergency</a>
        <a href="#" class="desktop-nav-item" id="profileLink">Profile</a>
      </nav>

      <div class="header-right">
        <button class="icon-btn" aria-label="Search">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16" y2="16"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- MAIN MAP CONTAINER -->
    <main class="map-wrapper">
      <div id="liveMap"></div>
    </main>

    <!-- EXACT NATIVE BOTTOM NAV[cite: 1] -->
    <nav class="bottom-nav" aria-label="Primary navigation">
      <!-- Adjusted paths and moved 'active' to View Map[cite: 1] -->
      <a href="../REPORT PAGE/index.html" class="bottom-nav-item">
        <span class="nav-icon"><img src="../assets/nav-report.png" alt="Report"></span>
        <span>Report</span>
      </a>
      <a href="index.html" class="bottom-nav-item active">
        <span class="nav-icon"><img src="../assets/nav-map.png" alt="View Map"></span>
        <span>View Map</span>
      </a>
      <a href="../HOME PAGE/index.html" class="bottom-nav-item">
        <span class="nav-icon"><img src="../assets/nav-home.png" alt="Home"></span>
        <span>Home</span>
      </a>
      <a href="tel:112" class="bottom-nav-item emergency">
        <span class="nav-icon"><img src="../assets/nav-emergency.png" alt="Emergency"></span>
        <span>Emergency</span>
      </a>
      <a href="#" class="bottom-nav-item" id="mobileProfileLink">
        <span class="nav-icon"><img src="../assets/nav-profile.png" alt="Profile"></span>
        <span>Profile</span>
      </a>
    </nav>
    
  </div>

  <!-- Leaflet JS & Custom Script -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
